<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMALIYA Restaurant</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="./images/R.png" alt="ROMALIYA Logo">
            <h2>ROMALIYA</h2>
        </div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Order</a>
            <a href="#">Promotion</a>
            <a href="#">About Us</a>
            <a href="#">Our Restaurant</a>
            <a href="#" class="bag">
                <img src="./images/order.png" alt="Order">
            </a>
        </nav>

        <div class="hamburger">
            <img src="./images/hamburger.png" alt="Menu">
        </div>

    </header>

    <section class="banner">
        <div class="banner-text">
            <p>CHEF'S</p>
            <h1>RECOMMENDATION</h1>
        </div>
    </section>

    <section class="recommendation">

        <div class="food">
            <img src="./images/xiarou.png" alt="Butter Poached Lobster">
            <h3>BUTTER-POACHED LOBSTER</h3>
        </div>

        <div class="food">
            <img src="./images/qkl.png" alt="Chocolate Ball on Cake">
            <h3>CHOCOLATE BALL ON CAKE</h3>
        </div>

        <div class="food">
            <img src="./images/nr.png" alt="Duck Breast">
            <h3>DUCK BREAST WITH CHERRY SAUCE</h3>
        </div>

    </section>

</body>
</html>
